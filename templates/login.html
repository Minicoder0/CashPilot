<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashPilot — Sign In</title>
    <meta name="description" content="Sign in to CashPilot, your AI-powered financial co-pilot for micro businesses.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <span class="login-logo-icon">✈️</span>
                <h1>Cash<span class="logo-accent">Pilot</span></h1>
            </div>
            <p class="login-subtitle">AI Financial Co-Pilot</p>
            <p class="login-desc">Sign in to access your AI-powered financial dashboard, transaction insights, and smart
                analytics.</p>

            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" data-tab="register" onclick="switchTab('register')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" onsubmit="handleEmailLogin(event)">
                <div class="auth-error" id="loginError"></div>
                <input type="email" id="loginEmail" class="auth-input" placeholder="Email address" required autocomplete="email">
                <input type="password" id="loginPassword" class="auth-input" placeholder="Password" required autocomplete="current-password">
                <button type="submit" class="auth-submit-btn" id="loginBtn">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" style="display:none" onsubmit="handleRegister(event)">
                <div class="auth-error" id="registerError"></div>
                <input type="text" id="registerName" class="auth-input" placeholder="Full name" required autocomplete="name">
                <input type="email" id="registerEmail" class="auth-input" placeholder="Email address" required autocomplete="email">
                <input type="password" id="registerPassword" class="auth-input" placeholder="Password (min 6 chars)" required minlength="6" autocomplete="new-password">
                <button type="submit" class="auth-submit-btn" id="registerBtn">Create Account</button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <a href="{{ url_for('auth_login') }}" class="google-btn" id="googleSignIn">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                <span>Continue with Google</span>
            </a>

            <p class="login-footer">Your data stays private. We only access your name and email.</p>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'flex' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'flex' : 'none';
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        async function handleEmailLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            errEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            try {
                const res = await fetch('/auth/email-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errEl.textContent = data.error || 'Login failed.';
                }
            } catch (err) {
                errEl.textContent = 'Network error. Please try again.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const errEl = document.getElementById('registerError');
            errEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('registerName').value,
                        email: document.getElementById('registerEmail').value,
                        password: document.getElementById('registerPassword').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errEl.textContent = data.error || 'Registration failed.';
                }
            } catch (err) {
                errEl.textContent = 'Network error. Please try again.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }
    </script>
</body>

</html>
